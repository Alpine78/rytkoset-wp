services:
  db:
    image: mariadb:10.11
    container_name: rytkoset-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: rytkoset_wp
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rytkoset-wp
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: rytkoset_wp
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wp_core:/var/www/html
      - ./wp-content:/var/www/html/wp-content

  # WP-CLI pyydettäessä käynnistyvä palvelu — ei käynnisty docker compose up:lla.
  # Käyttö: docker compose run --rm wpcli wp <komento>
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: rytkoset_wp
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wp_core:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      # Same PHP limits as the wordpress container's Dockerfile (docker/uploads.ini) -
      # the CLI image has no Dockerfile of its own, and WP-CLI bootstrapping
      # WooCommerce blocks needs more than PHP's 128M default.
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro

volumes:
  db_data:
  wp_core:
