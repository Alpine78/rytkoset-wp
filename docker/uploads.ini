; PHP upload limits for the local WordPress container.
; WordPress' default media upload cap comes from PHP (default 2M). These raise it
; for local development; dev/production limits are set on the FTPS host instead.
file_uploads = On
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_file_uploads = 20
