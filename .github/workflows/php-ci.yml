name: PHP CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Lint PHP files in theme
        run: |
          find wp-content/themes/rytkoset-theme -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Install Composer dev dependencies (PHPCS + WPCS + PHPUnit)
        run: composer install --no-interaction --no-progress

      - name: PHP_CodeSniffer (WordPress Coding Standards)
        run: composer run lint

      - name: PHPUnit (unit tests)
        run: composer run test
