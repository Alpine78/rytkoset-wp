name: Deploy theme to production

# Tietoturva: kaikki actionit on pinnattu commit-SHA:han (ei muuttuvia @v*-tageja),
# koska deploy käyttää tuotannon FTPS-secrettejä. Versio on SHA:n perässä kommenttina.
# Politiikka: docs/tietoturva.md → "Käyttöönoton tietoturva (GitHub Actions)".

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to deploy
        required: true
        default: main
      server_dir:
        description: Production theme directory
        required: true
        default: /wp-content/themes/rytkoset-theme/

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Lint PHP files in theme
        run: |
          find wp-content/themes/rytkoset-theme -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.PROD_FTP_HOST }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          port: ${{ secrets.PROD_FTP_PORT }}
          protocol: ftps
          local-dir: wp-content/themes/rytkoset-theme/
          server-dir: ${{ inputs.server_dir }}
          log-level: standard
          dangerous-clean-slate: false
